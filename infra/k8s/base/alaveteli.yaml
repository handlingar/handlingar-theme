# Alaveteli web + Sidekiq worker.
#
# Image: built from the repo Dockerfile, pinned to ALAVETELI_VERSION (P1-T4),
# and imported directly into each worker node's containerd (no registry yet —
# Phase 3/4 will publish to a real registry). Because the image is present on
# the node, imagePullPolicy is IfNotPresent so the kubelet never tries to pull.
#
# On boot each container materialises config/general.yml from the upstream
# example (the dev cluster has no secrets store yet) and the web pod runs
# `db:prepare` (idempotent: migrate + seed). Kept as a sh bootstrap so config
# can be iterated without rebuilding the (heavy) image.
---
apiVersion: v1
kind: Service
metadata:
  name: alaveteli
  namespace: handlingar
  labels:
    app: alaveteli
spec:
  selector:
    app: alaveteli
  ports:
    - name: http
      port: 80
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alaveteli-web
  namespace: handlingar
spec:
  replicas: 1
  strategy:
    type: Recreate          # single DB-migrating pod; avoid two booting at once
  selector:
    matchLabels:
      app: alaveteli
  template:
    metadata:
      labels:
        app: alaveteli
    spec:
      # Pinned to worker1: the image is imported into that node's containerd
      # only (single-upload over a slow uplink). Revisit when a registry exists.
      nodeSelector:
        kubernetes.io/hostname: handlingar-dev-pool-workers-worker1
      containers:
        - name: alaveteli
          image: alaveteli-handlingar:0.46.7.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -e
              cd /app/alaveteli
              # Use the handlingar config (THEME_URLS + sv locale + site name).
              cp config/general-handlingar-theme.yml config/general.yml
              # Public dev host (served via the Traefik ingress + Hetzner LB, P2-T4).
              sed -i "s#^DOMAIN:.*#DOMAIN: 'dev.nonprod.handlingar.se'#" config/general.yml
              # Dev-only: allow any Host header so BOTH the ingress host and
              # `kubectl port-forward` (localhost:3000) work. Real protection is
              # the ingress + TLS; host-auth is just a dev guard. (Rails 8 blocks
              # non-allowlisted hosts by default — this clears that allowlist.)
              mkdir -p config/initializers
              printf 'Rails.application.config.hosts.clear if Rails.env.development?\n' \
                > config/initializers/zz_dev_hosts.rb
              # db:migrate (NOT db:prepare): only touches the dev DB. db:prepare
              # also prepares the test DB in-process, where acts_as_versioned's
              # create_versioned_table reads a stale column cache and skips adding
              # public_bodies.version, breaking migration 026.
              echo "[boot] migrating database..."
              bundle exec rake db:migrate RAILS_ENV="$RAILS_ENV"
              # Clone + install the handlingar theme (per THEME_URLS/THEME_BRANCH).
              echo "[boot] installing handlingar theme..."
              bundle exec rake themes:install RAILS_ENV="$RAILS_ENV"
              # Xapian full-text index. Lives on the pod's EPHEMERAL filesystem
              # (lib/acts_as_xapian/xapiandbs/<env>), so every fresh pod starts
              # without one and /list/* + /search would 500 with
              # DatabaseNotFoundError. Tradeoff: for dev we simply rebuild the
              # (near-empty) index at boot instead of adding a PVC — simplest
              # reproducible option; revisit with a PVC when data volume grows.
              # Guarded so an in-place container restart with a surviving dir
              # skips the (destructive) full rebuild.
              if [ ! -d "lib/acts_as_xapian/xapiandbs/$RAILS_ENV" ]; then
                echo "[boot] building xapian index (missing)..."
                bundle exec rake xapian:destroy_and_rebuild_index \
                  models="PublicBody User InfoRequestEvent" RAILS_ENV="$RAILS_ENV"
              else
                echo "[boot] xapian index present, skipping rebuild"
              fi
              # Ongoing incremental index updates. Upstream runs
              # script/update-xapian-index from cron; for dev we run the same
              # rake task in a background loop inside this container (simplest
              # reproducible equivalent — no extra CronJob/sidecar to keep in
              # sync with the node-pinned image). Picks up new/changed records
              # (e.g. `make mock-data`) within ~60s.
              ( while true; do
                  bundle exec rake --silent xapian:update_index RAILS_ENV="$RAILS_ENV" \
                    >/dev/null 2>&1 || true
                  sleep 60
                done ) &
              echo "[boot] starting Rails..."
              exec bundle exec rails s -b 0.0.0.0 -p 3000
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef: { name: alaveteli-config }
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: alaveteli-secrets, key: db-password }
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 60      # allow up to ~10min for first boot + migrate
          resources:
            requests: { cpu: "250m", memory: "640Mi" }
            limits: { memory: "1792Mi" }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alaveteli-sidekiq
  namespace: handlingar
spec:
  replicas: 1
  selector:
    matchLabels:
      app: alaveteli-sidekiq
  template:
    metadata:
      labels:
        app: alaveteli-sidekiq
    spec:
      # Pinned to worker1: the image is imported into that node's containerd
      # only (single-upload over a slow uplink). Revisit when a registry exists.
      nodeSelector:
        kubernetes.io/hostname: handlingar-dev-pool-workers-worker1
      containers:
        - name: sidekiq
          image: alaveteli-handlingar:0.46.7.0
          imagePullPolicy: IfNotPresent
          command: ["/bin/bash", "-lc"]
          args:
            - |
              set -e
              cd /app/alaveteli
              cp config/general-handlingar-theme.yml config/general.yml
              # Wait for the web pod to finish migrating before processing jobs.
              echo "[boot] waiting for database schema..."
              until bundle exec rails runner 'ActiveRecord::Base.connection.tables' >/dev/null 2>&1; do
                sleep 5
              done
              exec bundle exec sidekiq
          envFrom:
            - configMapRef: { name: alaveteli-config }
          env:
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: alaveteli-secrets, key: db-password }
          resources:
            requests: { cpu: "100m", memory: "512Mi" }
            limits: { memory: "1536Mi" }
