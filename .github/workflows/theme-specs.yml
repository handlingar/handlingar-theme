name: Theme specs

on:
  pull_request:
  push:
    branches: [new-design-system]

permissions:
  contents: read

jobs:
  overlay-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Check Stripe, reCAPTCHA and design-system overlay contracts
        run: ruby script/check-overlay-contracts.rb
