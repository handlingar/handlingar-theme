name: Quality gate

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '27 6 * * 1'  # Mondays 06:27 UTC — weekly drift sweep
  workflow_dispatch:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history — privacy check derives personal tokens from commit authors
      - name: Run quality gate
        run: bash scripts/quality-gate.sh --ci
